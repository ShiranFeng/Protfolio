<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Shiran</title>
  <meta name="robots" content="noindex">
  <script>
    const base = document.createElement("base");
    const repository = window.location.pathname.split("/")[1];
    base.href = window.location.hostname.endsWith("github.io") && repository
      ? `/${repository}/`
      : "/";
    document.head.appendChild(base);
  </script>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="navbar-placeholder" data-depth="0"></div>

  <main class="container error-page">
    <p class="error-page__code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p class="error-page__message">The page you’re looking for doesn’t exist or may have moved.</p>
    <a class="btn btn-primary" href="./">Back to home</a>
  </main>

  <div id="footer-placeholder" data-depth="0"></div>

  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
